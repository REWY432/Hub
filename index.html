<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Производство ООО "Юпитер" | Fencing Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow-x: hidden;
        }

        /* Анимированный фон */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -5px rgba(59, 130, 246, 0.3); /* Blue glow */
        }
        
        .card-hover-mask:hover {
            box-shadow: 0 20px 40px -5px rgba(249, 115, 22, 0.3); /* Orange glow */
        }

        .icon-container {
            transition: transform 0.5s ease;
        }

        .card-hover:hover .icon-container {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <div class="bg-grid"></div>

    <!-- Заголовок -->
    <header class="text-center mb-12 animate-fade-in-down">
        <div class="inline-block p-2 px-4 rounded-full bg-slate-800 border border-slate-700 text-slate-400 text-sm font-semibold mb-4 tracking-wider uppercase">
            Система Управления
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white mb-2">
            Производство <span class="text-blue-500">Юпитер</span>
        </h1>
        <p class="text-slate-400 text-lg max-w-lg mx-auto mt-4">
            Выбери отдел для начала работы с сервисом
        </p>
    </header>

    <!-- Сетка карточек -->
    <div class="grid md:grid-cols-2 gap-8 w-full max-w-4xl z-10">
        
        <!-- Карточка Катушек -->
        <a href="https://rewy432.github.io/spool/" target="_blank" class="group relative block bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-slate-700 p-8 card-hover overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-blue-600/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            
            <div class="flex flex-col items-center text-center relative z-10">
                <div class="icon-container w-24 h-24 rounded-full bg-slate-900 border border-slate-600 flex items-center justify-center mb-6 group-hover:border-blue-500 transition-colors">
                    <!-- SVG Катушка -->
                    <svg class="w-12 h-12 text-blue-400 group-hover:text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                
                <h2 class="text-2xl font-bold text-white mb-2 group-hover:text-blue-400 transition-colors">Отдел Катушек</h2>
                <p class="text-slate-400 mb-6">Отслеживание производства катушек.</p>
                
                <span class="inline-flex items-center text-blue-400 font-semibold group-hover:translate-x-1 transition-transform">
                    Перейти в сервис 
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </span>
            </div>
        </a>

        <!-- Карточка Масок -->
        <a href="https://4fencingfactory.com/page102397866.html" target="_blank" class="group relative block bg-slate-800/80 backdrop-blur-sm rounded-2xl border border-slate-700 p-8 card-hover card-hover-mask overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-orange-600/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            
            <div class="flex flex-col items-center text-center relative z-10">
                <div class="icon-container w-24 h-24 rounded-full bg-slate-900 border border-slate-600 flex items-center justify-center mb-6 group-hover:border-orange-500 transition-colors">
                    <!-- SVG Маска -->
                    <svg class="w-12 h-12 text-orange-400 group-hover:text-orange-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 9h8M8 13h8M12 17v-4"></path>
                    </svg>
                </div>
                
                <h2 class="text-2xl font-bold text-white mb-2 group-hover:text-orange-400 transition-colors">Отдел Масок</h2>
                <p class="text-slate-400 mb-6">Отслеживание производства масок.</p>
                
                <span class="inline-flex items-center text-orange-400 font-semibold group-hover:translate-x-1 transition-transform">
                    Перейти в сервис 
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </span>
            </div>
        </a>

    </div>

    <!-- Футер -->
    <footer class="mt-16 text-slate-500 text-sm text-center">
        <p>&copy; 2026 Производство ООО "Юпитер"</p>
        <p class="mt-1 opacity-50">Версия 1.0</p>
    </footer>

</body>
</html>
